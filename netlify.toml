[build]
    # yarn build also writes sitemap.xml and robots.txt (next-sitemap) and the
    # Pagefind search index; `next build` alone shipped neither.
    command = "yarn build"
    publish = "dist"

[[redirects]]
from = "/restake"
to = "/staking/introduction"
status = 301

[[redirects]]
from = "/developers"
to = "/developers/blueprints/introduction"
status = 301

[[redirects]]
from = "/operators"
to = "/operators/introduction"
status = 301

# The Blueprint Agent section was previously routed at /vibe, then briefly /workbench.
# Keep both old paths alive.
[[redirects]]
from = "/vibe/*"
to = "/blueprint-agent/:splat"
status = 301

[[redirects]]
from = "/vibe"
to = "/blueprint-agent/introduction"
status = 301

[[redirects]]
from = "/workbench/*"
to = "/blueprint-agent/:splat"
status = 301

[[redirects]]
from = "/workbench"
to = "/blueprint-agent/introduction"
status = 301
# Intelligence has no docs section yet; its product site is the right page.
[[redirects]]
from = "/intelligence"
to = "https://intelligence.tangle.tools/"
status = 301

# Sandbox docs: the section root, the retired /infrastructure and /docs paths,
# and the /sandbox/sdk/* links older pages published. Explicit /docs rules come
