<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Headless Sandbox SDK recording</title>
    <link rel="stylesheet" href="/vendor/asciinema-player.css">
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #24232e; background: #f5f5f8; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { max-width: 1240px; margin: 0 auto; padding: 32px 24px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 20px; }
      h1 { font-size: 24px; letter-spacing: -.025em; font-weight: 600; margin: 0; }
      select, button { font: inherit; border: 1px solid #cccad6; border-radius: 7px; background: #fff; padding: 9px 12px; min-height: 42px; color: inherit; }
      #recording { max-width: 100%; min-width: 0; }
      a { color: #4e42c2; text-underline-offset: 4px; }
      a:focus-visible, select:focus-visible { outline: 3px solid #a299f0; outline-offset: 3px; }
      #note { margin: 0 0 20px; color: #585661; font-size: 16px; line-height: 1.5; }
      #note:empty { display: none; }
      #terminal { background: #121314; border: 1px solid #373638; border-radius: 12px; overflow: hidden; }
      #terminal .ap-wrapper { border-radius: 0; }
      #terminal .ap-player { padding: 12px 12px 0; }
      footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; flex-wrap: wrap; }
      .links { display: flex; gap: 20px; flex-wrap: wrap; font-size: 15px; }
      .speed { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #585661; }
      #error { line-height: 1.5; }
      [hidden] { display: none !important; }
      @media (max-width: 600px) { main { padding: 20px 12px; } header { align-items: flex-start; flex-direction: column; gap: 12px; } h1 { font-size: 21px; } #terminal { overflow-x: auto; } #player { min-width: 800px; } }
    </style>
  </head>
  <body>
    <main>
      <header><h1 id="title">Headless Sandbox SDK recording</h1><select id="recording" aria-label="Recording" hidden></select></header>
      <p id="note"></p>
      <p id="error" role="status">Loading recording…</p>
      <section id="terminal" aria-label="Recorded headless SDK output" hidden><div id="player"></div></section>
      <footer id="controls" hidden>
        <div class="links"><a id="reproduce" download hidden>Run this example</a><a id="result" hidden>Patch and tests</a><a id="original" download>Original recording</a><a id="mp4" download hidden>Video · 1×</a><a id="gif" download hidden>GIF · 1×</a></div>
        <label class="speed">Playback <select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
      </footer>
    </main>
    <script src="/vendor/asciinema-player.min.js"></script>
    <script type="module" src="/player.mjs"></script>
  </body>
</html>
